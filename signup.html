
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign Up - DecisionLog</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/auth.css">

    <!-- Firebase Authentication -->
    <script type="module" src="/src/auth.js"></script>
</head>

<body>

    <!-- Navigation Bar -->
    <header class="navbar">
        <a href="/index.html" class="logo">DecisionLog</a>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="/index.html">Home</a>
            <a href="/login.html">Log In</a>
        </nav>
    </header>

    <!-- Sign Up Section -->
    <main class="auth-container">

        <h1>Create an Account</h1>
        <p>Join DecisionLog and start organizing your choices.</p>

        <!-- Sign Up Form -->
        <form id="signupForm" class="auth-form">

            <!-- Email -->
            <label for="signupEmail">Email</label>
            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <!-- Password -->
            <label for="signupPassword">Password</label>
            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <!-- Confirm Password -->
            <label for="confirmPassword">Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                minlength="6"
                required
            >

            <!-- Sign Up Button -->
            <button type="submit" class="auth-button">
                Create Account
            </button>

            <!-- Error Message -->
            <p id="authMessage" class="auth-message" role="alert"></p>

        </form>

        <!-- Login Link -->
        <p class="auth-footer">
            Already have an account?
            <a href="/login.html">Log In</a>
        </p>

    </main>

</body>

</html>
