<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DecisionLog</title>

    <!-- CSS -->
    <link rel="stylesheet" href="/styles/style.css">
    <link rel="stylesheet" href="/styles/auth.css">

    <!-- JavaScript -->
    <script type="module" src="/src/main.js"></script>

</head>

<body>

    <!-- Developer 1 - Mohid: Navigation Bar -->
    <header class="navbar">
        <a href="/index.html" class="logo">DecisionLog</a>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="/index.html">Home</a>
            <a href="/login.html" id="createDecisionLink">

            </a>

            <!-- Login and Signup Links -->
            <a href="/login.html" id="loginLink">Log In</a>

            <!-- Developer 3 - Krish: Get Started Button -->
            <a href="/login.html"
               id="getStartedLink"
               class="cta-button">
                Get Started
            </a>
