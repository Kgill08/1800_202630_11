
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DecisionLog</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: #24324a;
            background-color: #f7f9fc;
        }

        /* Developer 1 - Mohid: Navbar Styling */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            background-color: white;
            border-bottom: 1px solid #e5e9f0;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #3156a3;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        .nav-links a {
            color: #344054;
            text-decoration: none;
            font-size: 15px;
        }

        .nav-links a:hover {
            color: #3156a3;
        }

        /* Developer 2 - Marco: Hero Section Styling */
        .hero {
            text-align: center;
            padding: 100px 8%;
            background-color: #eef3fb;
        }

        .hero h1 {
            font-size: 42px;
            color: #24324a;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            color: #667085;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Developer 3 - Krish: Call to Action Styling */
        .cta-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 32px;
            background-color: #3156a3;
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
        }

        .cta-button:hover {
            background-color: #24427f;
        }

        /* Responsive Styling */
        @media (max-width: 600px) {
            .navbar {
                padding: 18px 5%;
                flex-wrap: wrap;
                gap: 16px;
            }

            .nav-links {
                gap: 14px;
                flex-wrap: wrap;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Developer 1 - Mohid: Navbar -->
    <header class="navbar">
        <a href="#home" class="logo">DecisionLog</a>

        <nav class="nav-links" aria-label="Main navigation">
            <a href="#home">Home</a>
            <a href="#decisions">Past Decisions</a>
            <a href="#insights">Insights</a>
            <a href="#about">About</a>
        </nav>
    </header>

    <!-- Developer 2 - Marco: Welcome / Hero Section -->
    <main id="home">
        <section class="hero">
            <h1>Make Better Decisions with DecisionLog</h1>
            <p>
                Keep track of your decisions, reflect on your choices,
                and learn from your past experiences.
            </p>

            <!-- Developer 3 - Krish: Call to Action Button -->
            <a href="login.html" class="cta-button">Get Started</a>
        </section>
    </main>

</body>

</html>
